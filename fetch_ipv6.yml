name: Fetch IPv6 Live Sources

on:
  schedule:
    - cron: '0 2,14 * * *' # 每天UTC 2点和14点执行（对应北京时间10点和22点）
  workflow_dispatch: # 支持手动点击触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Fetch URLs and Merge
      run: |
        # 清空旧文件
        > live.txt
        
        # 抓取1 (普通链接)
        echo "Fetching pllive.txt..."
        curl -sL "https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt" >> live.txt
        
        # 抓取2 (需要解析的链接，GitHub网络原生支持IPv6和该域名)
        echo "Fetching koo666 50085..."
        curl -sL "http://koo666.online:50085/sub?nFMW1pnS=txt" >> live.txt
        
        echo "Fetching koo666 51666..."
        curl -sL "http://koo666.online:51666" >> live.txt
        
        echo "Fetching koo666 5908..."
        curl -sL "http://koo666.online:5908" >> live.txt

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add live.txt
        git diff --staged --quiet || git commit -m "Update live.txt sources"
        git push

