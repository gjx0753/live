name: IPTV Auto Update 3
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run
      run: |
        echo "Start"
        OK=0
        FAIL=0
        
        # ==========================================
        # 1. 抓取源数据 (完全保持原样，只是逻辑改为解析并带优先级)
        # ==========================================
        : > raw_parsed.txt

        fetch() {
          local name="$1"
          local url="$2"
          local prio="$3" # 新增优先级参数
          echo "Fetch: $name"
          local data=$(curl -sL --connect-timeout 15 --max-time 30 -k "$url" 2>&1)
          if [ -n "$data" ]; then
            # 解析 M3U 格式
            echo "$data" | awk -v p="$prio" '
              /#EXTINF/ { info=$0; next }
              /^http/ { 
                if(info!="") {
                  split(info, arr, ",");
                  name = arr[length(arr)];
                  gsub(/^[ \t]+|[ \t]+$/, "", name);
                  if(name == "") name = "Unknown";
                  print name","$0","p
                }
                info=""
              }
            ' >> raw_parsed.txt
            echo "$name OK"
            OK=$((OK + 1))
          else
            echo "$name FAIL"
            FAIL=$((FAIL + 1))
          fi
        }

        # 在这里预设优先级：1=最高(Guovin), 2=中(Fan/Zb), 3=低(Yue/Joe), 4=其他
        fetch "G6" "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv6/result.m3u" 1
        fetch "G4" "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u" 1
        fetch "Fan" "https://live.fanmingming.cn/tv/m3u/ipv6.m3u" 2
        fetch "Yan" "https://tv.iill.top/m3u/Gather" 2
        fetch "Zb6" "https://live.zbds.org/tv/iptv6.m3u" 2
        fetch "Zb4" "https://live.zbds.org/tv/iptv4.m3u" 2
        fetch "Su4" "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv4.m3u" 2
        fetch "Su6" "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv6.m3u" 2
        fetch "Aktv" "https://aktv.space/live.m3u" 2
        fetch "Jn" "https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt" 3
        fetch "YueG" "https://raw.githubusercontent.com/YueChan/Live/main/GNTV.m3u" 3
        fetch "YueGl" "https://raw.githubusercontent.com/YueChan/Live/main/Global.m3u" 3
        fetch "YueH" "https://raw.githubusercontent.com/YueChan/Live/main/Hunan.txt" 3
        fetch "YueI" "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u" 3
        fetch "Iber" "https://m3u.ibert.me/fmml_ipv6.m3u" 3
        fetch "Kim" "https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u" 3
        fetch "Joe" "https://raw.githubusercontent.com/joevess/IPTV/main/m3u/iptv.m3u" 3
        fetch "YueR" "https://raw.githubusercontent.com/YueChan/Live/main/Radio.m3u" 4
        fetch "Burn" "https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u" 4
        fetch "Zwc" "https://raw.githubusercontent.com/zwc456baby/iptv_alive/refs/heads/master/live.m3u" 4
        fetch "Huj" "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8" 4
        fetch "Ft" "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/IPV6.m3u" 4
        fetch "Ttt" "http://tttttt.tttttttttt.top/jk.txt" 5

        echo "Sources OK: $OK, FAIL: $FAIL"

        # ==========================================
        # 2. 优先级去重 (保留最高优先级的单条记录)
        # ==========================================
        if [ -s raw_parsed.txt ]; then
          # 先按频道名排序，再按优先级数字排序(小的在前)，然后只保留每个频道名第一次出现的记录
          sort -t',' -k1,1 -k3,3n raw_parsed.txt | awk -F',' '!seen[$1]++' > deduped.txt
          echo "After dedup: $(wc -l < deduped.txt) channels"
        else
          : > deduped.txt
        fi

        # ==========================================
        # 3. 有效性验证 (并发)
        # ==========================================
        echo "Validating..."
        rm -rf valid_tmp
        mkdir -p valid_tmp

        validate() {
          local line="$1"
          local ch=$(echo "$line" | cut -d',' -f1)
          local url=$(echo "$line" | cut -d',' -f2)
          
          local is_valid=0
          if [[ "$url" =~ ^https?:// ]]; then
            # 先尝试 HEAD
            local code=$(curl -I -s -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 -k "$url" 2>/dev/null)
            if [[ "$code" =~ ^[23] ]]; then
              is_valid=1
            else
              # HEAD失败，尝试 GET 前1KB
              local getcode=$(curl -s -o /dev/null -w "%{http_code}" -r 0-1023 --connect-timeout 3 --max-time 5 -k "$url" 2>/dev/null)
              if [[ "$getcode" =~ ^[23] ]]; then is_valid=1; fi
            fi
          else
            is_valid=1
          fi

          if [ "$is_valid" -eq 1 ]; then
            # 写入原格式 (保留 M3U 信息或只存 URL)
            # 这里为了后续方便，直接存 URL
            echo "$url" >> "valid_tmp/urls.txt"
          fi
        }

        while IFS=',' read -r ch url prio; do
          [ -z "$url" ] && continue
          validate "$ch,$url,$prio" &
          if [[ $(( $(jobs -r | wc -l) % 20 )) -eq 0 ]]; then wait; fi
        done < deduped.txt
        wait

        # ==========================================
        # 4. 生成 DPlayer 格式 + 多线路合并
        # ==========================================
        echo "Generating final files..."

        if [ -f "valid_tmp/urls.txt" ]; then
          # 这里产生一个微小的变化：原逻辑是从 raw.txt grep。
          # 为了支持多线路合并，我们需要知道哪些 URL 属于哪个频道。
          # 由于去重时我们丢弃了部分链接，这里我们只能基于“去重后的有效链接”来生成。
          # 但为了让文件看起来像原来那样，我们需要把 URL 转回 m3u 格式，或者生成 txt 格式。
          
          # 根据 "DPlayer格式" 的要求，格式为：频道名,链接
          # 我们需要反向生成一个临时文件，格式：频道名,链接
          : > valid_final.txt
          while IFS=',' read -r ch url prio; do
             if grep -qxF "$url" "valid_tmp/urls.txt"; then
               echo "$ch,$url" >> valid_final.txt
             fi
          done < deduped.txt

          # 4.1 生成 live.txt (按原始分组逻辑: CCTV -> 卫视 -> 其他)
          : > live.txt
          
          # 央视
          if grep -i "CCTV" valid_final.txt > cctv_tmp.txt 2>/dev/null; then
            echo "CCTV,#genre#" >> live.txt
            awk -F',' '{if($1 in urls) urls[$1]=urls[$1]"#"$2; else urls[$1]=$2} END{for(i in urls) print i","urls[i]}' cctv_tmp.txt >> live.txt
          fi

          # 卫视
          if grep -i "卫视" valid_final.txt > sat_tmp.txt 2>/dev/null; then
            echo "卫视,#genre#" >> live.txt
            awk -F',' '{if($1 in urls) urls[$1]=urls[$1]"#"$2; else urls[$1]=$2} END{for(i in urls) print i","urls[i]}' sat_tmp.txt >> live.txt
          fi

          # 其他 (剩余的所有)
          grep -viE "CCTV|卫视" valid_final.txt > other_tmp.txt 2>/dev/null || : > other_tmp.txt
          if [ -s other_tmp.txt ]; then
            echo "其他,#genre#" >> live.txt
            awk -F',' '{if($1 in urls) urls[$1]=urls[$1]"#"$2; else urls[$1]=$2} END{for(i in urls) print i","urls[i]}' other_tmp.txt >> live.txt
          fi

          # 4.2 生成单独文件 (复用上面的逻辑)
          : > CCTV.txt
          if [ -s cctv_tmp.txt ]; then
             echo "CCTV,#genre#" >> CCTV.txt
             awk -F',' '{if($1 in urls) urls[$1]=urls[$1]"#"$2; else urls[$1]=$2} END{for(i in urls) print i","urls[i]}' cctv_tmp.txt >> CCTV.txt
          fi

          : > Satellite.txt
          if [ -s sat_tmp.txt ]; then
             echo "卫视,#genre#" >> Satellite.txt
             awk -F',' '{if($1 in urls) urls[$1]=urls[$1]"#"$2; else urls[$1]=$2} END{for(i in urls) print i","urls[i]}' sat_tmp.txt >> Satellite.txt
          fi

        else
            echo "No valid channels found!"
            : > live.txt
            : > CCTV.txt
            : > Satellite.txt
        fi

        # 统计
        TOTAL=$(grep -cE "^http|^rtmp|^rtsp" live.txt 2>/dev/null || echo 0)
        echo "Total Valid: $TOTAL"

        : > out.txt
        echo "OK=$OK" >> out.txt
        echo "FAIL=$FAIL" >> out.txt
        echo "TOTAL=$TOTAL" >> out.txt

    - name: Read Outputs
      if: always()
      id: read
      run: |
        if [ -f out.txt ]; then
          while IFS='=' read -r key value; do
            echo "$key=$value" >> $GITHUB_OUTPUT
          done < out.txt
        fi

    - name: Commit
      run: |
        git config --global user.name "Bot"
        git config --global user.email "bot@github.com"
        git add .
        git diff --staged --quiet || git commit -m "Auto Update"
        git push

    - name: Summary
      if: always()
      run: |
        echo "## IPTV Update Report" >> $GITHUB_STEP_SUMMARY
        echo "- Sources OK: ${{ steps.read.outputs.OK }}" >> $GITHUB_STEP_SUMMARY
        echo "- Sources FAIL: ${{ steps.read.outputs.FAIL }}" >> $GITHUB_STEP_SUMMARY
        echo "- Valid Channels: ${{ steps.read.outputs.TOTAL }}" >> $GITHUB_STEP_SUMMARY
