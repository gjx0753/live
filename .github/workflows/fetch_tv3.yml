name: Enhanced TV Source Manager

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次
  workflow_dispatch:

# 提前使用 Node.js 24 避免弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Network Check
      run: |
        echo "==================== 网络环境检测 ===================="
        
        # 测试常用域名连通性
        domains=(
          "raw.githubusercontent.com"
          "github.com"
          "tv.iill.top"
          "live.zbds.org"
        )
        
        for domain in "${domains[@]}"; do
          echo -n "测试 $domain: "
          if curl -sI --connect-timeout 5 --max-time 10 "https://$domain" > /dev/null 2>&1; then
            echo "✅"
          else
            echo "⚠️ (连接超时或被拒绝，将尝试继续运行)"
          fi
        done
        echo "======================================================"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Fetch, Validate, Categorize and Merge
      id: fetch_process
      run: |
        echo "==================== 开始高级抓取任务 ===================="
        echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S UTC')"
        
        # 初始化文件
        > live_all_raw.txt
        > live_valid.txt
        > failed_sources.txt
        > validation_report.txt
        > success_sources.txt
        
        # 优先级定义 (数值越小优先级越高)
        declare -A SOURCE_PRIORITY=(
          ["Guovin"]=10
          ["fanmingming"]=20
          ["YueChan"]=30
          ["myIPTV"]=40
          ["jn950"]=50
          ["Default"]=99
        )

        # 统计变量
        declare -i total_sources=0
        declare -i success_count=0
        declare -i failed_count=0
        declare -i total_fetched=0
        declare -i valid_channels=0
        declare -i invalid_channels=0
        
        # ==========================================
        # 格式转换函数 (M3U -> TXT)
        # ==========================================
        convert_m3u_to_txt() {
          awk 'BEGIN { channel="" } 
               /^#EXTINF/ { 
                 n=split($0, a, ","); 
                 channel=a[n]; 
                 gsub(/^[[:space:]]+|[[:space:]]+$/, "", channel);
                 next 
               } 
               /^http/ { 
                 if (channel != "") { 
                   print channel "," $0; 
                   channel="" 
                 } else { 
                   print $0 
                 } 
               }'
        }

        # ==========================================
        # 增强的安全抓取函数 (修复 Exit Code 52)
        # ==========================================
        fetch_and_merge() {
          local url="$1"
          local source_name="$2"
          local priority_val="${SOURCE_PRIORITY[$source_name]:-${SOURCE_PRIORITY[Default]}}"
          
          total_sources=$((total_sources + 1))
          echo ""
          echo "[$total_sources] 正在抓取: $source_name"
          echo "     URL: $url"
          
          local raw_content=""
          local attempt=0
          local max_attempts=3
          local error_msg=""
          
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "     → 尝试 $attempt/$max_attempts..."
            
            # 使用增强的 curl 参数
            raw_content=$(curl -sL \
              --connect-timeout 15 \
              --max-time 30 \
              -k \
              --retry 2 \
              --retry-delay 1 \
              --retry-all-errors \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" \
              -H "Accept: */*" \
              -H "Cache-Control: no-cache" \
              "$url" 2>&1)
            
            local exit_code=$?
            
            # 检查是否成功
            if [ $exit_code -eq 0 ] && [ -n "$raw_content" ] && [[ ! "$raw_content" =~ ^<.*>$ ]]; then
              # 排除空响应和 HTML 错误页面
              echo "     ✅ 成功获取内容"
              
              # 转换并添加优先级标记 (格式: 频道,URL,优先级)
              if [[ "$raw_content" == *"EXTINF"* ]]; then
                echo "$raw_content" | convert_m3u_to_txt | awk -v prio="$priority_val" '{print $0 "," prio}' >> live_all_raw.txt
                local channel_count=$(echo "$raw_content" | convert_m3u_to_txt | wc -l)
              else
                echo "$raw_content" | awk -v prio="$priority_val" '{print $0 "," prio}' >> live_all_raw.txt
                local channel_count=$(echo "$raw_content" | wc -l)
              fi
              
              echo "     📺 解析频道数: $channel_count"
              success_count=$((success_count + 1))
              total_fetched=$((total_fetched + channel_count))
              echo "$source_name - OK - $channel_count channels" >> success_sources.txt
              return 0
              
            elif [ $exit_code -eq 52 ]; then
              error_msg="Exit 52: 服务器无返回/空数据"
              echo "     ⚠️ $error_msg"
            elif [ $exit_code -eq 6 ]; then
              error_msg="Exit 6: 无法解析域名"
              echo "     ⚠️ $error_msg"
            elif [ $exit_code -eq 28 ]; then
              error_msg="Exit 28: 请求超时"
              echo "     ⚠️ $error_msg"
            else
              # 捕获其他错误
              error_msg="Exit $exit_code"
              echo "     ⚠️ 错误代码: $exit_code"
            fi
            
            # 如果不是最后一次尝试，等待后重试
            if [ $attempt -lt $max_attempts ]; then
              echo "     ⏳ 等待 2 秒后重试..."
              sleep 2
            fi
          done
          
          # 最终失败处理
          echo "     ❌ 最终失败: $error_msg"
          echo "$source_name ($url) - $error_msg" >> failed_sources.txt
          failed_count=$((failed_count + 1))
          return 1
        }

        # ==========================================
        # 执行抓取任务
        # ==========================================
        echo ""
        echo "====== 步骤 1/4: 开始抓取源列表 ======"
        
        # --- 核心高优先级源 ---
        fetch_and_merge "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv6/result.m3u" "Guovin-IPv6"
        fetch_and_merge "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u" "Guovin-IPv4"
        fetch_and_merge "https://live.fanmingming.cn/tv/m3u/ipv6.m3u" "fanmingming"
        
        # --- 次级源 ---
        fetch_and_merge "https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt" "jn950"
        
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/GNTV.m3u" "YueChan-GNTV"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/Global.m3u" "YueChan-Global"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/Hunan.txt" "YueChan-Hunan"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u" "YueChan-IPTV"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/Radio.m3u" "YueChan-Radio"
        
        fetch_and_merge "https://tv.iill.top/m3u/Gather" "YanG-1989"
        
        fetch_and_merge "https://live.zbds.org/tv/iptv6.m3u" "vbskycn-IPv6"
        fetch_and_merge "https://live.zbds.org/tv/iptv4.m3u" "vbskycn-IPv4"
        
        fetch_and_merge "https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u" "Kimentanm"
        fetch_and_merge "https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u" "BurningC4"
        fetch_and_merge "https://raw.githubusercontent.com/zwc456baby/iptv_alive/refs/heads/master/live.m3u" "zwc456baby"
        
        fetch_and_merge "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8" "ChinaIPTV"
        
        fetch_and_merge "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv4.m3u" "myIPTV-IPv4"
        fetch_and_merge "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv6.m3u" "myIPTV-IPv6"
        
        fetch_and_merge "http://tttttt.tttttttttt.top/jk.txt" "传说引导页"
        
        fetch_and_merge "https://m3u.ibert.me/fmml_ipv6.m3u" "iptv-sources"
        
        fetch_and_merge "https://raw.githubusercontent.com/joevess/IPTV/main/m3u/iptv.m3u" "joevess"
        fetch_and_merge "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/IPV6.m3u" "Ftindy"
        
        fetch_and_merge "https://aktv.space/live.m3u" "AKTV"

        echo ""
        echo "====== 抓取阶段汇总 ======"
        echo "  总源数: $total_sources"
        echo "  ✅ 成功: $success_count"
        echo "  ❌ 失败: $failed_count"
        echo "  📺 原始频道总数: $total_fetched"

        # 设置输出变量
        echo "success_count=$success_count" >> $GITHUB_OUTPUT
        echo "failed_count=$failed_count" >> $GITHUB_OUTPUT
        echo "total_raw_channels=$total_fetched" >> $GITHUB_OUTPUT

        # 如果全部失败，给出警告但不退出
        if [ $success_count -eq 0 ]; then
          echo ""
          echo "⚠️ 警告: 所有源都抓取失败了！"
          echo "失败的源详情:"
          cat failed_sources.txt
          echo ""
          echo "将尝试继续执行后续步骤（如果有旧数据）..."
        fi

        # ==========================================
        # 步骤 2: 智能优先级去重
        # ==========================================
        echo ""
        echo "====== 步骤 2/4: 智能优先级去重 ======"
        
        if [ ! -s live_all_raw.txt ]; then
          echo "⚠️ 没有新获取的数据，跳过去重。"
          # 如果没有新数据，保持原有去重文件（如果存在）或创建空文件
          if [ -f live_deduped.txt ]; then
            echo "保留之前的去重数据。"
          else
            > live_deduped.txt
          fi
        else
          # 使用 awk 进行去重：按频道名($1)分组，按优先级($3)升序排序，取第一条
          awk -F',' '
          {
            channel = $1;
            url = $2;
            priority = $3 + 0; # 确保是数字
            
            # 如果该频道名第一次出现，或者当前优先级比已存的高(数值小)
            if (!(channel in data)) {
              data[channel] = url;
              prio[channel] = priority;
            } else {
              if (priority < prio[channel]) {
                data[channel] = url;
                prio[channel] = priority;
              }
            }
          }
          END {
            for (channel in data) {
              # 输出格式: 频道,URL (去除优先级标记)
              print channel "," data[channel];
            }
          }' live_all_raw.txt > live_deduped.txt
          
          local before=$(wc -l < live_all_raw.txt)
          local after=$(wc -l < live_deduped.txt)
          echo "  去重前: $before 行"
          echo "  去重后: $after 行"
          echo "  删除重复: $((before - after)) 行"
        fi

        # ==========================================
        # 步骤 3: 链接可用性验证 (HEAD 请求)
        # ==========================================
        echo ""
        echo "====== 步骤 3/4: 链接有效性验证 ======"
        
        if [ ! -s live_deduped.txt ]; then
          echo "⚠️ 没有可验证的链接，跳过验证。"
          cp live_deduped.txt live_valid.txt 2>/dev/null || > live_valid.txt
        else
          declare -i check_total=0
          declare -i check_success=0
          declare -i check_failed=0
          
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            channel_name="${line%%,*}"
            url="${line##*,}"
            
            check_total=$((check_total + 1))
            
            # 进度显示
            if (( check_total % 20 == 0 )); then
              echo -n "已检: $check_total ... "
            fi
            
            # 简单的 URL 格式校验
            if [[ ! "$url" =~ ^https?:// ]]; then
              echo "$line" >> live_valid.txt
              check_success=$((check_success + 1))
              continue
            fi
            
            # 执行验证 (超时3秒)
            status=$(curl -I -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 3 \
              --max-time 5 \
              -k \
              "$url" 2>/dev/null) || true
            
            # 状态码 2xx, 3xx 认为有效
            if [[ "$status" =~ ^[23][0-9]{2}$ ]]; then
              echo "$line" >> live_valid.txt
              check_success=$((check_success + 1))
            else
              echo "[$status] $channel_name" >> validation_report.txt
              check_failed=$((check_failed + 1))
            fi
          done < live_deduped.txt
          
          echo ""
          echo "  验证总数: $check_total"
          echo "  ✅ 有效链接: $check_success"
          echo "  ❌ 无效链接: $check_failed"
          
          valid_channels=$check_success
          invalid_channels=$check_failed
        fi
        
        echo "valid_channels=$valid_channels" >> $GITHUB_OUTPUT
        echo "invalid_channels=$invalid_channels" >> $GITHUB_OUTPUT

        # ==========================================
        # 步骤 4: 自动分类生成
        # ==========================================
        echo ""
        echo "====== 步骤 4/4: 自动分类生成 ======"
        
        if [ ! -s live_valid.txt ]; then
          echo "⚠️ 没有有效链接，生成空分类文件。"
          > live.txt
          > CCTV.txt
          > Satellite.txt
          > Regional.txt
        else
          # 生成总表
          cp live_valid.txt live.txt
          
          # 央视 (匹配 CCTV 或 央视)
          grep -iE "CCTV|央视" live_valid.txt > CCTV.txt || touch CCTV.txt
          
          # 卫视 (匹配 卫视 或 具体热门卫视)
          grep -iE "卫视|湖南|浙江|江苏|东方|北京|广东|深圳" live_valid.txt > Satellite.txt || touch Satellite.txt
          
          # 地方台 (排除央视和卫视)
          grep -viE "CCTV|央视|卫视|湖南|浙江|江苏|东方|北京|广东|深圳" live_valid.txt > Regional.txt || touch Regional.txt
          
          echo "  📂 分类文件已生成:"
          echo "     - live.txt (总表): $(wc -l < live.txt)"
          echo "     - CCTV.txt (央视): $(wc -l < CCTV.txt)"
          echo "     - Satellite.txt (卫视): $(wc -l < Satellite.txt)"
          echo "     - Regional.txt (地方): $(wc -l < Regional.txt)"
        fi
        
        echo ""
        echo "==================== 任务完成 ===================="
        echo "结束时间: $(date '+%Y-%m-%d %H:%M:%S UTC')"
        echo "=================================================="

    - name: Upload Reports and Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: detailed-reports-${{ github.run_number }}
        path: |
          failed_sources.txt
          validation_report.txt
          success_sources.txt
          live_all_raw.txt
        retention-days: 7

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # 添加所有生成的分类文件
        git add live.txt CCTV.txt Satellite.txt Regional.txt
        
        # 检查是否有变化
        if git diff --staged --quiet; then
          echo "🤷‍♂️ 文件无变化，跳过提交"
          echo "SKIP_PUSH=true" >> $GITHUB_ENV
        else
          git commit -m "📅 Auto Update: $(date '+%Y-%m-%d %H:%M:%S UTC')

📊 **统计报告:**
  • 成功源数: ${{ steps.fetch_process.outputs.success_count }}
  • 失败源数: ${{ steps.fetch_process.outputs.failed_count }}
  • 原始频道: ${{ steps.fetch_process.outputs.total_raw_channels }}
  • 有效频道: ${{ steps.fetch_process.outputs.valid_channels }}
  • 无效剔除: ${{ steps.fetch_process.outputs.invalid_channels }}

🚀 由 GitHub Actions 自动构建"
          
          git push
          echo "✅ 推送成功"
          echo "SKIP_PUSH=false" >> $GITHUB_ENV
        fi

    - name: Send Telegram Notification
      if: always()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # 读取文件行数
        if [ -f live.txt ]; then
          total=$(wc -l < live.txt)
          cctv=$(wc -l < CCTV.txt 2>/dev/null || echo 0)
          sat=$(wc -l < Satellite.txt 2>/dev/null || echo 0)
          reg=$(wc -l < Regional.txt 2>/dev/null || echo 0)
        else
          total=0; cctv=0; sat=0; reg=0
        fi
        
        # 确定状态图标
        if [ "${{ steps.fetch_process.outputs.success_count }}" -eq 0 ]; then
          STATUS="⛔ 所有源均失败"
        elif [ "$SKIP_PUSH" = "true" ]; then
          STATUS="ℹ️ 无内容更新"
        else
          STATUS="✅ 任务执行成功"
        fi
        
        # 构建消息 (使用 MarkdownV2)
        MESSAGE="📺 **IPTV 源自动更新报告**

$STATUS

📊 **频道统计:**
📡 总频道数: \`$total\`
🏛️ 央视频道: \`$cctv\`
📡 卫视频道: \`$sat\`
🏙️ 地方频道: \`$reg\`

🔧 **运行详情:**
✅ 成功源: \`${{ steps.fetch_process.outputs.success_count }}\`
❌ 失败源: \`${{ steps.fetch_process.outputs.failed_count }}\`
✅ 有效链接: \`${{ steps.fetch_process.outputs.valid_channels }}\`

🕒 更新时间: \`$(date '+%Y-%m-%d %H:%M:%S UTC')\`

[🔗 查看运行详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

        # 发送请求 (如果配置了 Token)
        if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="MarkdownV2" \
            -d text="${MESSAGE}"
          echo ""
          echo "📲 Telegram 通知已发送"
        else
          echo "⚠️ 未配置 TELEGRAM_TOKEN 或 TELEGRAM_CHAT_ID，跳过通知"
        fi

    - name: Build Summary Report
      if: always()
      run: |
        echo "## 📊 运行摘要" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📈 数据统计" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 指标 | 数量 |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| 成功源数 | ${{ steps.fetch_process.outputs.success_count }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 失败源数 | ${{ steps.fetch_process.outputs.failed_count }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 最终有效频道 | ${{ steps.fetch_process.outputs.valid_channels }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 央视频道 | $(wc -l < CCTV.txt 2>/dev/null || echo 0) |" >> $GITHUB_STEP_SUMMARY
        echo "| 卫视频道 | $(wc -l < Satellite.txt 2>/dev/null || echo 0) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # 如果有失败，列出失败源
        if [ -s failed_sources.txt ]; then
          echo "### ⚠️ 失败源列表" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          head -10 failed_sources.txt | sed 's/^/ - /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
