name: IPTV Auto Update ip_v6(Fusion Edition)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Run
      run: |
        echo "Starting Fetch and Validate Process..."
        rm -f live_with_group.txt && touch live_with_group.txt
        
        # ==========================================
        # 第一步：智能抓取与格式统一（融合代码2的优点）
        # ==========================================
        parse_and_append() {
          local url="$1"
          local name="$2"
          echo "Fetching $name..."
          
          # 容错抓取：防止单个源失败退出，增加超时时间
          local raw_content=$(curl -sL --connect-timeout 15 --max-time 30 -k "$url" 2>/dev/null) || true
          
          if [ -z "$raw_content" ]; then
            echo "Warning: Failed to fetch or empty response from $name"
            return
          fi
          
          # 智能识别：检测是否包含 M3U 标识
          if echo "$raw_content" | grep -q "#EXTINF"; then
            echo "Detected M3U format, converting with groups..."
            # 提取频道名、URL和分组(group-title)，输出格式：频道名,URL,分组名
            echo "$raw_content" | awk '
            /#EXTINF/ {
              info = $0
              group = ""
              if (match(info, /group-title="([^"]+)"/, arr)) {
                group = arr[1]
              }
              n = split(info, arr, ",")
              name = arr[n]
              gsub(/^[ \t]+|[ \t]+$/, "", name)
              next
            }
            /#EXTGRP/ {
              group = $0
              sub(/^#EXTGRP:/, "", group)
              gsub(/^[ \t]+|[ \t]+$/, "", group)
              next
            }
            /^http/ {
              if (info != "") {
                print name "," $0 "," group
              }
              info = ""
              group = ""
            }
            ' >> live_with_group.txt
          else
            echo "Detected TXT format, appending directly..."
            # 如果是TXT格式，补齐第三列(分组)为空，保持格式统一
            echo "$raw_content" | awk -F',' '/^http/{print ","$0","} !/^http/ && NF>1 {print $1","$2","}' >> live_with_group.txt
          fi
        }

        # 开始抓取 (即使某一个连不上，也不会影响其他源)
        parse_and_append "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv6/result.m3u" "G6"
        parse_and_append "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u" "G4"
        parse_and_append "https://live.fanmingming.cn/tv/m3u/ipv6.m3u" "Fan"
        parse_and_append "https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt" "Jn"
        parse_and_append "https://raw.githubusercontent.com/YueChan/Live/main/GNTV.m3u" "YueG"
        parse_and_append "https://raw.githubusercontent.com/YueChan/Live/main/Global.m3u" "YueGl"
        parse_and_append "https://raw.githubusercontent.com/YueChan/Live/main/Hunan.txt" "YueH"
        parse_and_append "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u" "YueI"
        parse_and_append "https://raw.githubusercontent.com/YueChan/Live/main/Radio.m3u" "YueR"
        parse_and_append "https://tv.iill.top/m3u/Gather" "Yan"
        parse_and_append "https://live.zbds.org/tv/iptv6.m3u" "Zb6"
        parse_and_append "https://live.zbds.org/tv/iptv4.m3u" "Zb4"
        parse_and_append "https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u" "Kim"
        parse_and_append "https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u" "Burn"
        parse_and_append "https://raw.githubusercontent.com/zwc456baby/iptv_alive/refs/heads/master/live.m3u" "Zwc"
        parse_and_append "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8" "Huj"
        parse_and_append "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv4.m3u" "Su4"
        parse_and_append "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv6.m3u" "Su6"
        parse_and_append "http://tttttt.tttttttttt.top/jk.txt" "Ttt"
        parse_and_append "https://m3u.ibert.me/fmml_ipv6.m3u" "Iber"
        parse_and_append "https://raw.githubusercontent.com/joevess/IPTV/main/m3u/iptv.m3u" "Joe"
        parse_and_append "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/IPV6.m3u" "Ft"
        parse_and_append "https://aktv.space/live.m3u" "Aktv"

        # ==========================================
        # 第二步：精准去重
        # ==========================================
        echo "Deduplicating..."
        if [ -s live_with_group.txt ]; then
          # 清理空行并按行去重
          awk 'NF && !seen[$0]++' live_with_group.txt > live_dedup.txt
        else
          : > live_dedup.txt
        fi

        # ==========================================
        # 第三步：防误杀并发验证（融合代码1的优点）
        # ==========================================
        echo "Validating links (15 concurrent)..."
        
        rm -rf valid_parts
        mkdir -p valid_parts

        check_line() {
          local line="$1"
          # 提取URL (第二列)
          local url=$(echo "$line" | cut -d',' -f2)
          
          if [ -n "$url" ]; then
            # 1. 伪装请求头
            local ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            local referer=$(echo "$url" | awk -F/ '{print $1 "//" $3}')
            
            # 2. 第一次验证 (用 Range 请求替代 HEAD，防误杀)
            local http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              -A "$ua" \
              -e "$referer" \
              --connect-timeout 5 \
              --max-time 10 \
              -r 0-1024 \
              -k "$url" 2>/dev/null)
            
            # 3. 失败重试机制
            if ! echo "$http_code" | grep -qE "^[23]"; then
              sleep 1
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                -A "$ua" \
                -e "$referer" \
                --connect-timeout 5 \
                --max-time 10 \
                -r 0-1024 \
                -k "$url" 2>/dev/null)
            fi
            
            # 4. 判断有效性
            if echo "$http_code" | grep -qE "^[23]"; then
              echo "$line" >> "valid_parts/$BASHPID"
            fi
          fi
        }

        # 并发执行验证，控制在15个进程防止网络拥堵
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          check_line "$line" &
          if [ $(jobs -r | wc -l) -ge 15 ]; then
            wait
          fi
        done < live_dedup.txt
        wait

        # 合并验证通过的内容
        cat valid_parts/* > live_valid.txt 2>/dev/null || : > live_valid.txt

        # ==========================================
        # 第四步：生成分组与最终输出
        # ==========================================
        echo "Regenerating groups..."
        
        # 读取验证后的数据，按顺序生成分组头
        awk '
        BEGIN {
          FS=","
        }
        {
          name=$1; url=$2; group=$3
          # 如果分组存在且还没输出过该分组头，则输出
          if (group != "" && !printed[group]++) {
            print group ",#genre#"
          }
          print name "," url
        }
        ' live_valid.txt > live.txt

        # ==========================================
        # 恢复原有的分类逻辑
        # ==========================================
        grep -i "CCTV" live.txt > CCTV.txt 2>/dev/null || : > CCTV.txt
        grep -i "卫视" live.txt > Satellite.txt 2>/dev/null || : > Satellite.txt

        echo "Total lines: $(wc -l < live.txt)"

    - name: Commit
      run: |
        git config --global user.name "Bot"
        git config --global user.email "bot@github.com"
        git add live.txt CCTV.txt Satellite.txt
        git diff --staged --quiet || git commit -m "Auto Update (Fusion Optimized)"
        git push
