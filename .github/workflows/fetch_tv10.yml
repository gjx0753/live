name: Enhanced TV Source Manager

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make script executable
      run: chmod +x iptv_script.sh

    - name: Run IPTV Script
      id: process
      run: ./iptv_script.sh

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ github.run_number }}
        path: |
          failed_sources.txt
          validation_report.txt
          success_sources.txt
        retention-days: 3
        if-no-files-found: ignore

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add live.txt CCTV.txt Satellite.txt Regional.txt
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
          echo "SKIP=true" >> $GITHUB_ENV
        else
          git commit -m "Auto Update: $(date)"
          git push
          echo "SKIP=false" >> $GITHUB_ENV
        fi

    - name: Telegram Notify
      if: always()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        total=$(wc -l < live.txt 2>/dev/null || echo 0)
        cctv=$(wc -l < CCTV.txt 2>/dev/null || echo 0)
        sat=$(wc -l < Satellite.txt 2>/dev/null || echo 0)
        
        if [ "${{ steps.process.outputs.success_count }}" -eq 0 ]; then
          STATUS="Failed"
        elif [ "$SKIP" = "true" ]; then
          STATUS="No Update"
        else
          STATUS="Success"
        fi
        
        MSG="IPTV Update: $STATUS
        Total: $total | CCTV: $cctv | Sat: $sat
        Src OK: ${{ steps.process.outputs.success_count }} | Valid: ${{ steps.process.outputs.valid_channels }}"
        
        if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MSG"
        fi

    - name: Summary
      if: always()
      run: |
        echo "## Report" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Success | ${{ steps.process.outputs.success_count }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Failed | ${{ steps.process.outputs.failed_count }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Valid | ${{ steps.process.outputs.valid_channels }} |" >> $GITHUB_STEP_SUMMARY
