name: Enhanced TV Source Manager

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Network Check
      run: |
        echo "Network Check..."
        domains=("raw.githubusercontent.com" "github.com" "tv.iill.top" "live.zbds.org")
        for domain in "${domains[@]}"; do
          echo -n "Check $domain: "
          if curl -sI --connect-timeout 5 --max-time 10 "https://$domain" > /dev/null 2>&1; then 
            echo "OK" 
          else 
            echo "WARN" 
          fi
        done

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Fetch and Process
      id: process
      run: |
        echo "Starting task at $(date)"
        
        # 初始化文件（确保文件存在）
        touch live_all_raw.txt
        touch live_valid.txt
        touch live_deduped.txt
        touch failed_sources.txt
        touch validation_report.txt
        touch success_sources.txt
        
        # 优先级定义
        declare -A SOURCE_PRIORITY=(
          ["Guovin"]=10
          ["fanmingming"]=20
          ["YueChan"]=30
          ["myIPTV"]=40
          ["Default"]=99
        )
        
        # 统计变量
        declare -i total_sources=0
        declare -i success_count=0
        declare -i failed_count=0
        declare -i total_fetched=0
        declare -i valid_channels=0
        declare -i invalid_channels=0

        # M3U转TXT函数
        convert_m3u_to_txt() {
          awk 'BEGIN { channel="" } 
               /^#EXTINF/ { 
                 n=split($0, a, ","); 
                 channel=a[n]; 
                 gsub(/^[[:space:]]+|[[:space:]]+$/, "", channel);
                 next 
               } 
               /^http/ { 
                 if (channel != "") { 
                   print channel "," $0; 
                   channel="" 
                 } else { 
                   print $0 
                 } 
               }'
        }

        # 抓取函数
        fetch_and_merge() {
          local url="$1"
          local name="$2"
          local prio="${SOURCE_PRIORITY[$name]:-${SOURCE_PRIORITY[Default]}}"
          
          total_sources=$((total_sources + 1))
          echo "[$total_sources] Fetching: $name"
          
          local raw=""
          local attempt=0
          while [ $attempt -lt 3 ]; do
            attempt=$((attempt + 1))
            echo "   Attempt $attempt/3..."
            
            raw=$(curl -sL \
              --connect-timeout 15 \
              --max-time 30 \
              -k \
              --retry 2 \
              --retry-delay 1 \
              --retry-all-errors \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Accept: */*" \
              "$url" 2>&1) || true
            
            local exit_code=$?
            
            if [ $exit_code -eq 0 ] && [ -n "$raw" ] && [[ ! "$raw" =~ ^<.*>$ ]]; then
              echo "   OK"
              
              if [[ "$raw" == *"EXTINF"* ]]; then
                echo "$raw" | convert_m3u_to_txt | awk -v p="$prio" '{print $0 "," p}' >> live_all_raw.txt
                local c=$(echo "$raw" | convert_m3u_to_txt | wc -l)
              else
                echo "$raw" | awk -v p="$prio" '{print $0 "," p}' >> live_all_raw.txt
                local c=$(echo "$raw" | wc -l)
              fi
              
              success_count=$((success_count + 1))
              total_fetched=$((total_fetched + c))
              echo "$name - OK - $c channels" >> success_sources.txt
              return 0
            fi
            
            sleep 2
          done
          
          echo "   FAILED"
          echo "$name ($url) - FAILED" >> failed_sources.txt
          failed_count=$((failed_count + 1))
          return 1
        }

        # 执行抓取
        echo "=== Step 1/4: Fetching Sources ==="
        fetch_and_merge "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv6/result.m3u" "Guovin-IPv6"
        fetch_and_merge "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u" "Guovin-IPv4"
        fetch_and_merge "https://live.fanmingming.cn/tv/m3u/ipv6.m3u" "fanmingming"
        fetch_and_merge "https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt" "jn950"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/GNTV.m3u" "YueChan-GNTV"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/Global.m3u" "YueChan-Global"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/Hunan.txt" "YueChan-Hunan"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u" "YueChan-IPTV"
        fetch_and_merge "https://raw.githubusercontent.com/YueChan/Live/main/Radio.m3u" "YueChan-Radio"
        fetch_and_merge "https://tv.iill.top/m3u/Gather" "YanG-1989"
        fetch_and_merge "https://live.zbds.org/tv/iptv6.m3u" "vbskycn-IPv6"
        fetch_and_merge "https://live.zbds.org/tv/iptv4.m3u" "vbskycn-IPv4"
        fetch_and_merge "https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u" "Kimentanm"
        fetch_and_merge "https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u" "BurningC4"
        fetch_and_merge "https://raw.githubusercontent.com/zwc456baby/iptv_alive/refs/heads/master/live.m3u" "zwc456baby"
        fetch_and_merge "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8" "ChinaIPTV"
        fetch_and_merge "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv4.m3u" "myIPTV-IPv4"
        fetch_and_merge "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv6.m3u" "myIPTV-IPv6"
        fetch_and_merge "http://tttttt.tttttttttt.top/jk.txt" "传说引导页"
        fetch_and_merge "https://m3u.ibert.me/fmml_ipv6.m3u" "iptv-sources"
        fetch_and_merge "https://raw.githubusercontent.com/joevess/IPTV/main/m3u/iptv.m3u" "joevess"
        fetch_and_merge "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/IPV6.m3u" "Ftindy"
        fetch_and_merge "https://aktv.space/live.m3u" "AKTV"

        echo "=== Step 1 Summary ==="
        echo "Sources: $success_count OK, $failed_count Failed"
        echo "Total channels fetched: $total_fetched"

        # 设置输出变量
        echo "success_count=$success_count" >> $GITHUB_OUTPUT
        echo "failed_count=$failed_count" >> $GITHUB_OUTPUT
        echo "total_raw_channels=$total_fetched" >> $GITHUB_OUTPUT

        # 智能去重
        echo ""
        echo "=== Step 2/4: Deduplicating ==="
        if [ -s live_deduped.txt ]; then
          awk -F',' '
          {
            channel = $1;
            url = $2;
            priority = $3 + 0;
            if (!(channel in data)) {
              data[channel] = url;
              prio[channel] = priority;
            } else {
              if (priority < prio[channel]) {
                data[channel] = url;
                prio[channel] = priority;
              }
            }
          }
          END {
            for (channel in data) {
              print channel "," data[channel];
            }
          }' live_all_raw.txt > live_deduped.txt
          
          local before=$(wc -l < live_all_raw.txt)
          local after=$(wc -l < live_deduped.txt)
          echo "Before: $before, After: $after, Removed: $((before - after))"
        else
          echo "No data to deduplicate"
          touch live_deduped.txt
        fi

        # 链接验证
        echo ""
        echo "=== Step 3/4: Validating Links ==="
        if [ -s live_deduped.txt ]; then
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            
            url="${line##*,}"
            
            if [[ ! "$url" =~ ^https?:// ]]; then
              echo "$line" >> live_valid.txt
              valid_channels=$((valid_channels + 1))
            else
              status=$(curl -I -s -o /dev/null -w "%{http_code}" \
                --connect-timeout 3 \
                --max-time 5 \
                -k \
                "$url" 2>/dev/null) || true
              
              if [[ "$status" =~ ^[23][0-9]{2}$ ]]; then
                echo "$line" >> live_valid.txt
                valid_channels=$((valid_channels + 1))
              else
                echo "[$status] $url" >> validation_report.txt
                invalid_channels=$((invalid_channels + 1))
              fi
            fi
          done < live_deduped.txt
          
          echo "Valid: $valid_channels, Invalid: $invalid_channels"
        else
          echo "No links to validate"
          touch live_valid.txt
        fi
        
        echo "valid_channels=$valid_channels" >> $GITHUB_OUTPUT
        echo "invalid_channels=$invalid_channels" >> $GITHUB_OUTPUT

        # 分类生成
        echo ""
        echo "=== Step 4/4: Categorizing ==="
        cp live_valid.txt live.txt || true
        grep -iE "CCTV|央视" live_valid.txt > CCTV.txt || touch CCTV.txt
        grep -iE "卫视|湖南|浙江|江苏|东方|北京|广东|深圳" live_valid.txt > Satellite.txt || touch Satellite.txt
        grep -viE "CCTV|央视|卫视|湖南|浙江|江苏|东方|北京|广东|深圳" live_valid.txt > Regional.txt || touch Regional.txt
        
        echo "Generated files:"
        echo "  live.txt: $(wc -l < live.txt)"
        echo "  CCTV.txt: $(wc -l < CCTV.txt)"
        echo "  Satellite.txt: $(wc -l < Satellite.txt)"
        echo "  Regional.txt: $(wc -l < Regional.txt)"
        
        echo ""
        echo "Task completed at $(date)"

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ github.run_number }}
        path: |
          failed_sources.txt
          validation_report.txt
          success_sources.txt
        retention-days: 3
        if-no-files-found: ignore

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        git add live.txt CCTV.txt Satellite.txt Regional.txt
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
          echo "SKIP=true" >> $GITHUB_ENV
        else
          git commit -m "Auto Update: $(date '+%Y-%m-%d %H:%M:%S UTC')

Stats:
  Success: ${{ steps.process.outputs.success_count }}
  Failed: ${{ steps.process.outputs.failed_count }}
  Total: ${{ steps.process.outputs.total_raw_channels }}
  Valid: ${{ steps.process.outputs.valid_channels }}"

          git push
          echo "SKIP=false" >> $GITHUB_ENV
        fi

    - name: Telegram Notification
      if: always()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -f live.txt ]; then
          total=$(wc -l < live.txt)
          cctv=$(wc -l < CCTV.txt 2>/dev/null || echo 0)
          sat=$(wc -l < Satellite.txt 2>/dev/null || echo 0)
          reg=$(wc -l < Regional.txt 2>/dev/null || echo 0)
        else
          total=0; cctv=0; sat=0; reg=0
        fi
        
        if [ "${{ steps.process.outputs.success_count }}" -eq 0 ]; then
          STATUS="Failed"
        elif [ "$SKIP" = "true" ]; then
          STATUS="No Update"
        else
          STATUS="Success"
        fi
        
        MSG_TEXT="IPTV Source Update Report
$STATUS

Channels:
Total: $total
CCTV: $cctv | Satellite: $sat | Regional: $reg

Sources:
Success: ${{ steps.process.outputs.success_count }}
Failed: ${{ steps.process.outputs.failed_count }}
Valid: ${{ steps.process.outputs.valid_channels }}"

        if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG_TEXT"
          echo "Telegram notification sent"
        else
          echo "Telegram not configured"
        fi

    - name: Build Summary
      if: always()
      run: |
        echo "## IPTV Source Update Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Success Sources | ${{ steps.process.outputs.success_count }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Failed Sources | ${{ steps.process.outputs.failed_count }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Total Channels | ${{ steps.process.outputs.total_raw_channels }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Valid Channels | ${{ steps.process.outputs.valid_channels }} |" >> $GITHUB_STEP_SUMMARY
        echo "| CCTV | $(wc -l < CCTV.txt 2>/dev/null || echo 0) |" >> $GITHUB_STEP_SUMMARY
        echo "| Satellite | $(wc -l < Satellite.txt 2>/dev/null || echo 0) |" >> $GITHUB_STEP_SUMMARY
        echo "| Regional | $(wc -l < Regional.txt 2>/dev/null || echo 0) |" >> $GITHUB_STEP_SUMMARY
