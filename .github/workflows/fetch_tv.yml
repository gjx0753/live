name: Fetch and Merge TV Sources

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Fetch and Merge URLs
      run: |
        echo "Starting fetch..."
        > live.txt
        curl -sL --connect-timeout 10 --max-time 30 "https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt" >> live.txt
        echo "" >> live.txt
        curl -sL --connect-timeout 5 --max-time 10 -k "http://koo666.online:50085/sub?nFMW1pnS=txt" >> live.txt
        echo "" >> live.txt
        curl -sL --connect-timeout 5 --max-time 10 -k "http://koo666.online:51666" >> live.txt
        echo "" >> live.txt
        curl -sL --connect-timeout 5 --max-time 10 -k "http://koo666.online:5908" >> live.txt

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add live.txt
        git diff --staged --quiet || git commit -m "Auto update live.txt"
        git push
