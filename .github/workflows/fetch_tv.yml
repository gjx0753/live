name: Fetch and Validate TV Sources

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean workflow file encoding
      run: |
        # 强制将工作流自身转换为 Unix 格式 (LF换行)，防止 Windows 复制粘贴导致的 CRLF 语法报错
        sed -i 's/\r$//' .github/workflows/fetch_tv.yml

    - name: Fetch, Validate and Merge URLs
      shell: bash
      run: |
        echo "====== Step 1: Fetching Sources ======"
        TEMP_RAW="raw_merged.txt"
        > "$TEMP_RAW"

        # 定义源列表
        SOURCES=(
          "pllive|https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt"
          "wangziduoqing|http://wangziduoqing.com/yuan/zb.txt"
          "koo666-50085|http://koo666.online:50085/sub?nFMW1pnS=txt"
          "koo666-51666|http://koo666.online:51666"
          "koo666-5908|http://koo666.online:5908"
        )

        for SOURCE in "${SOURCES[@]}"; do
          NAME="${SOURCE%%|*}"
          URL="${SOURCE##*|}"
          echo ">>> Fetching: $NAME"
          
          HTTP_CODE=$(curl -sL --connect-timeout 10 --max-time 30 \
            -w "%{http_code}" -o "${NAME}.tmp" "$URL") || true
          
          if [ -s "${NAME}.tmp" ] && [ "$HTTP_CODE" = "200" ]; then
            LINES=$(wc -l < "${NAME}.tmp")
            echo "    ✅ Success ($LINES lines)"
            cat "${NAME}.tmp" >> "$TEMP_RAW"
          else
            echo "    ❌ Failed (HTTP $HTTP_CODE)"
          fi
          rm -f "${NAME}.tmp"
        done

        echo "====== Step 2: Converting M3U to TXT & Cleaning ======"
        # 强制统一换行符，杀死导致 URL 失效的 \r 字符
        sed -i 's/\r$//' "$TEMP_RAW"

        # 将 M3U 转换为 TXT，兼容各种 TXT
        awk '
        /^#EXTINF/ {
            n = split($0, a, ",")
            channel_name = a[n]
            gsub(/^[ \t]+|[ \t]+$/, "", channel_name)
            getline
            url = $0
            gsub(/^[ \t]+|[ \t]+$/, "", url)
            if (url ~ /^http/ && channel_name != "") {
                print channel_name "," url
            }
            next
        }
        /^#EXTM3U/ { next }
        /^#/ { next }
        {
            line = $0
            gsub(/^[ \t]+|[ \t]+$/, "", line)
            if (line ~ /^http/) {
                print "Unknown," line
            } else if (line ~ /,/) {
                print line
            } else if (line ~ /[ \t]/) {
                sub(/[ \t]+/, ",", line)
                print line
            }
        }
        ' "$TEMP_RAW" > "cleaned.txt"

        # 去空行、去重
        sed -i '/^\s*$/d' "cleaned.txt"
        awk '!seen[$0]++' "cleaned.txt" > "temp_uniq.txt"
        mv "temp_uniq.txt" "cleaned.txt"

        TOTAL_RAW=$(wc -l < "cleaned.txt")
        echo "Total unique lines to validate: $TOTAL_RAW"
        rm -f "$TEMP_RAW"

        echo "====== Step 3: Validating Streams (Concurrency: 20) ======"
        mkdir -p valid_results
        rm -f valid_results/*

        cat << 'SCRIPT' > validate.sh
#!/bin/bash
LINE="$1"
RESULT_FILE="valid_results/$BASHPID.tmp"

URL=$(echo "$LINE" | sed 's/.*\(https\?:\/\/\)/\1/')
if [ -z "$URL" ]; then
  exit 1
fi

CONTENT_TYPE=$(curl -sS -m 8 -r 0-500000 -o /dev/null -w "%{content_type}" -L "$URL" 2>/dev/null)

if [[ "$CONTENT_TYPE" =~ (video|audio|octet-stream|mpegurl|mp2t) ]]; then
  echo "$LINE" > "$RESULT_FILE"
fi
SCRIPT
        chmod +x validate.sh

        # 并发检测
        cat cleaned.txt | xargs -P 20 -I {} bash validate.sh "{}"

        # 合并有效结果
        cat valid_results/*.tmp > live.txt 2>/dev/null || true
        VALID_COUNT=$(wc -l < live.txt 2>/dev/null || echo 0)
        
        echo "====== Done! Valid streams: $VALID_COUNT / $TOTAL_RAW ======"

        # 清理
        rm -f cleaned.txt validate.sh
        rm -rf valid_results

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add live.txt
        git diff --staged --quiet || git commit -m "Auto update live.txt [Valid: $(wc -l < live.txt) streams] $(date -u +%Y-%m-%dT%H:%MZ)"
        git push
