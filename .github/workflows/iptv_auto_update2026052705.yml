name: IPTV Auto Update txt
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: iptv_auto_update2026052705
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Merge and Validate
      run: |
        echo "===== Step 1: Fetch Sources ====="
        : > raw.txt
        
        fetch() {
          local name="$1"
          local url="$2"
          echo "Fetch: $name"
          local data=$(curl -sL --connect-timeout 10 --max-time 20 -k "$url")
          if [ -n "$data" ]; then
            echo "$data" >> raw.txt
            echo "$name OK"
          else
            echo "$name FAIL"
          fi
        }

        fetch "G6" "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv6/result.m3u"
        fetch "G4" "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u"
        fetch "Fan" "https://live.fanmingming.cn/tv/m3u/ipv6.m3u"
        fetch "Jn" "https://raw.githubusercontent.com/jn950/live/main/tv/pllive.txt"
        fetch "YueG" "https://raw.githubusercontent.com/YueChan/Live/main/GNTV.m3u"
        fetch "YueGl" "https://raw.githubusercontent.com/YueChan/Live/main/Global.m3u"
        fetch "YueH" "https://raw.githubusercontent.com/YueChan/Live/main/Hunan.txt"
        fetch "YueI" "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u"
        fetch "YueR" "https://raw.githubusercontent.com/YueChan/Live/main/Radio.m3u"
        fetch "Yan" "https://tv.iill.top/m3u/Gather"
        fetch "Zb6" "https://live.zbds.org/tv/iptv6.m3u"
        fetch "Zb4" "https://live.zbds.org/tv/iptv4.m3u"
        fetch "Kim" "https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u"
        fetch "Burn" "https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u"
        fetch "Zwc" "https://raw.githubusercontent.com/zwc456baby/iptv_alive/refs/heads/master/live.m3u"
        fetch "Huj" "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8"
        fetch "Su4" "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv4.m3u"
        fetch "Su6" "https://raw.githubusercontent.com/suxuang/myIPTV/refs/heads/main/ipv6.m3u"
        fetch "Ttt" "http://tttttt.tttttttttt.top/jk.txt"
        fetch "Iber" "https://m3u.ibert.me/fmml_ipv6.m3u"
        fetch "Joe" "https://raw.githubusercontent.com/joevess/IPTV/main/m3u/iptv.m3u"
        fetch "Ft" "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/IPV6.m3u"
        fetch "Aktv" "https://aktv.space/live.m3u"

        echo "===== Step 2: Parse to TXT ====="
        # 修复 awk 兼容性问题：不使用 gawk 特有的 match 数组功能
        awk '
        BEGIN { info=""; name=""; group="" }
        {
          line = $0
          gsub(/\r/, "", line)
          if (line == "") next

          if (line ~ /^#EXTINF/) {
            info = line
            group = ""
            # 兼容所有 awk 版本提取 group-title
            if (info ~ /group-title="/) {
              temp = substr(info, index(info, "group-title=\"") + 13)
              split(temp, arr, "\"")
              group = arr[1]
            }
            n = split(info, arr, ",")
            name = arr[n]
            gsub(/^[ \t]+|[ \t]+$/, "", name)
            next
          }
          
          if (line ~ /^#EXTGRP/) {
            sub(/^#EXTGRP:/, "", line)
            gsub(/^[ \t]+|[ \t]+$/, "", line)
            group = line
            next
          }

          if (line ~ /^http/ || line ~ /^rtmp/ || line ~ /^rtsp/) {
            if (info != "" && name != "") {
               # 过滤掉形如 "2026-05-16 11:37:47" 的更新时间行
               if (name !~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}/) {
                 print name "," line "," group
               }
            } 
            else if (line ~ /,/) {
              n = split(line, arr, ",")
              if (n >= 2 && arr[2] ~ /^http/) {
                gsub(/^[ \t]+|[ \t]+$/, "", arr[1])
                gsub(/^[ \t]+|[ \t]+$/, "", arr[2])
                print arr[1] "," arr[2] ","
              }
            }
            else {
               print "未知频道," line ","
            }
          }
        }' raw.txt > parsed.txt

        echo "Parsed lines: $(wc -l < parsed.txt)"

        echo "===== Step 3: Validate Links ====="
        : > valid.txt
        
        # 优化并发验证，使用 -d '\n' 处理带特殊字符的行
        cat parsed.txt | xargs -P 30 -d '\n' -I {} sh -c '
          line="{}"
          url=$(echo "$line" | cut -d"," -f2)
          if [ -n "$url" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 6 -k "$url" 2>/dev/null)
            if echo "$code" | grep -qE "^(200|206|301|302|403|405)"; then
               echo "$line"
            fi
          fi
        ' >> valid.txt || true

        echo "Valid lines: $(wc -l < valid.txt)"

        echo "===== Step 4: Generate Final live.txt ====="
        awk -F',' '
        BEGIN { OFS="," }
        {
          name=$1; url=$2; group=$3
          gsub(/^[ \t]+|[ \t]+$/, "", name)
          gsub(/^[ \t]+|[ \t]+$/, "", url)
          gsub(/^[ \t]+|[ \t]+$/, "", group)

          if (group == "") group="其他频道"

          key=name","url

          if (url != "" && !seen[key]++) {
            if (!group_printed[group]++) {
              print group ",#genre#"
            }
            print name "," url
          }
        }' valid.txt > live.txt

        # 使用 || true 防止 grep 找不到内容时报错退出
        grep -i "CCTV" live.txt > CCTV.txt 2>/dev/null || true
        grep -i "卫视" live.txt > Satellite.txt 2>/dev/null || true

        echo "Final live.txt lines: $(grep -v ",#genre#" live.txt | wc -l)"

    - name: Commit
      run: |
        git config --global user.name "Bot"
        git config --global user.email "bot@github.com"
        git add live.txt CCTV.txt Satellite.txt
        git diff --staged --quiet || git commit -m "Auto Update"
        git push
