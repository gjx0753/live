name: IPTV Auto Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make script executable
      run: chmod +x run_iptv.sh

    - name: Run IPTV Script
      id: run_script
      run: ./run_iptv.sh

    - name: Read Script Outputs
      if: always()
      id: read_outputs
      run: |
        if [ -f iptv_outputs.txt ]; then
          while IFS='=' read -r key value; do
            echo "$key=$value" >> $GITHUB_OUTPUT
          done < iptv_outputs.txt
        fi

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ github.run_number }}
        path: |
          failed_sources.txt
          validation_report.txt
          success_sources.txt
          iptv_outputs.txt
        retention-days: 7
        if-no-files-found: ignore

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add live.txt CCTV.txt Satellite.txt Regional.txt
        
        if git diff --staged --quiet; then
          echo "No changes detected."
          echo "HAS_CHANGES=false" >> $GITHUB_ENV
        else
          git commit -m "Auto Update: $(date)"
          git push
          echo "HAS_CHANGES=true" >> $GITHUB_ENV
        fi

    - name: Telegram Notify
      if: always()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        TOTAL=$(wc -l < live.txt 2>/dev/null || echo 0)
        CCTV=$(wc -l < CCTV.txt 2>/dev/null || echo 0)
        SAT=$(wc -l < Satellite.txt 2>/dev/null || echo 0)
        
        SUCCESS="${{ steps.read_outputs.outputs.success_count }}"
        VALID="${{ steps.read_outputs.outputs.valid_channels }}"
        
        if [ -z "$SUCCESS" ]; then SUCCESS="0"; fi
        
        MSG="IPTV Update Report
        
Status: Success
Total: $TOTAL | CCTV: $CCTV | Sat: $SAT
Sources OK: $SUCCESS
Valid Links: $VALID"
        
        if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG"
        fi

    - name: Build Summary
      if: always()
      run: |
        echo "IPTV Update Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Success Sources: ${{ steps.read_outputs.outputs.success_count }}" >> $GITHUB_STEP_SUMMARY
        echo "Failed Sources: ${{ steps.read_outputs.outputs.failed_count }}" >> $GITHUB_STEP_SUMMARY
        echo "Total Channels: ${{ steps.read_outputs.outputs.total_raw_channels }}" >> $GITHUB_STEP_SUMMARY
        echo "Valid Channels: ${{ steps.read_outputs.outputs.valid_channels }}" >> $GITHUB_STEP_SUMMARY
